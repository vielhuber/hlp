name: CI

env:
    CI: true

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'
            - '[0-9]*'

jobs:
    build-test:
        runs-on: ${{ matrix.operating-system }}

        strategy:
            matrix:
                operating-system: ['ubuntu-latest', 'macos-latest', 'windows-latest']
                node-versions: ['lts/*']

        name: ${{ matrix.operating-system }} (Node ${{ matrix.node-versions }})

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Node
              uses: actions/setup-node@v6
              with:
                  node-version: '${{ matrix.node-versions }}'

            - name: NPM
              run: npm install

            - name: Test
              run: npm run js:tests

    publish:
        if: startsWith(github.ref, 'refs/tags/')
        needs: build-test
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: NPM
              run: npm install

            - name: Verify version
              run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

            - name: Build
              run: npm run prod --if-present

            - name: Publish
              run: npm publish
